name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # One Linux runner cross-compiles all three targets: no macOS runner
    # (10x minutes), no artifact upload/download, no artifact storage.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...
      - run: scripts/package.sh --release all

      - name: Smoke-test the installer
        run: |
          prefix="$RUNNER_TEMP/prefix"
          INSTALL_BASE_URL="file://$PWD/dist" AX_PREFIX="$prefix" sh scripts/install.sh ax fsx
          "$prefix/bin/ax" -h >/dev/null
          "$prefix/bin/fsx" describe >/dev/null

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cp "$GITHUB_WORKSPACE/scripts/install.sh" install.sh
          gh release create "$GITHUB_REF_NAME" \
            ax-*-*.tar.gz SHA256SUMS install.sh \
            --repo "$GITHUB_REPOSITORY" --generate-notes

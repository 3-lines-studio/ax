name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # One Linux runner cross-compiles all three targets: no macOS runner
    # (10x minutes), no artifact upload/download, no artifact storage.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...
      - run: scripts/package.sh --release all

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for artifact in *-linux-* *-darwin-*; do
            case $artifact in *.sha256) continue ;; esac
            sha256sum "$artifact"
          done > SHA256SUMS
          cp "$GITHUB_WORKSPACE/scripts/install.sh" install.sh
          gh release create "$GITHUB_REF_NAME" \
            *-linux-* *-darwin-* SHA256SUMS install.sh \
            --repo "$GITHUB_REPOSITORY" --generate-notes

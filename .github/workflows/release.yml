name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-14
            target: darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - run: go test ./...
      - run: scripts/package.sh all

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          for artifact in *-linux-* *-darwin-*; do
            case $artifact in *.sha256) continue ;; esac
            sha256sum "$artifact"
          done > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cp "$GITHUB_WORKSPACE/scripts/install.sh" install.sh
          gh release create "$GITHUB_REF_NAME" \
            *-linux-* *-darwin-* SHA256SUMS install.sh \
            --repo "$GITHUB_REPOSITORY" --generate-notes

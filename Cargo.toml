[package]
name = "ax"
version = "0.1.0"
edition = "2021"
description = "Minimal LLM coding agent harness (port of ax-go)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
